<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="宝田ジャグ">
    <meta name="author" content="Akira Takarada">
    <link rel="icon" href="data:,">
    <title>宝田ジャグ</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        #cube {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="cube"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // 1. 定数・マスタデータ定義
        // =========================================================================
        const mySymbols = { 
            'BUDOU': './img/budo.png', 'BEL': './img/onigiri.png', 'PIERO': './img/piero.png',
            'RIP': './img/panda.png', 'BAR': './img/god.png', '7': './img/7.png', 'CHE': './img/cherry2.png'
        };

        // リール配列（1番〜21番の順）
        const layoutLeft   = ['BEL','7','RIP','BUDOU','RIP','BUDOU','BAR','CHE','BUDOU','RIP','BUDOU','7','PIERO','BUDOU','RIP','BUDOU','CHE','BAR','BUDOU','RIP','BUDOU'];
        const layoutCenter = ['RIP','7','BUDOU','CHE','RIP','BEL','BUDOU','CHE','RIP','BAR','BUDOU','CHE','RIP','BEL','BUDOU','CHE','RIP','BAR','BUDOU','CHE','PIERO'];
        const layoutRight  = ['BUDOU','7','BAR','BEL','RIP','BUDOU','PIERO','BEL','RIP','BUDOU','PIERO','BEL','RIP','BUDOU','PIERO','BEL','RIP','BUDOU','PIERO','BEL','RIP'];
        const reelHairetsu = [layoutLeft, layoutCenter, layoutRight];

        const enmLeft = 0, enmCenter = 1, enmRight = 2;
        const msec1koma = (60000 / 80) / 21; 
        const rad1koma = (2 * Math.PI) / 21; 
        const reelWidth = 0.05;
        const reelheight = 0.22 / 2; 

        // 状態フラグ
        const STATE_NO_BONUS = 0; 
        const STATE_IN_BIG    = 1; 
        const STATE_IN_REG    = 2; 
        const STATE_JAC_BIG   = 3; 
        const STATE_JAC_REG   = 4; 

        // 成立フラグ
        const FLAG_HAZURE   = 0;
        const FLAG_BUDOU    = 1;
        const FLAG_REPLAY   = 2;
        const FLAG_CHERRY   = 3;
        const FLAG_PIERO    = 4;
        const FLAG_BELL     = 5;
        const FLAG_BIG      = 6; 
        const FLAG_REG      = 7; 

        const FLAG_TO_SYMBOL = {
            [FLAG_BUDOU]: 'BUDOU', [FLAG_REPLAY]: 'RIP', [FLAG_CHERRY]: 'CHE',
            [FLAG_PIERO]: 'PIERO', [FLAG_BELL]: 'BEL', [FLAG_BIG]: '7', [FLAG_REG]: 'BAR'
        };

        // =========================================================================
        // 2. 状態管理（状態変数）
        // =========================================================================
        let main_state = STATE_NO_BONUS; 
        let main_flgKoyaku = FLAG_HAZURE; 
        
        let reelControls = {};   
        let reelTotalMsec = [-1, -1, -1];    
        
        // 中段に20番（インデックス19）を表示させるための初期設定
        let reelPos = [19, 19, 19];          
        let reelPosPrev = [18, 18, 18];      
        let reelPosWillStop = [19, 19, 19];  

        let width = window.innerWidth;
        let height = window.innerHeight;
        let timeStart, timeElapsed;

        // =========================================================================
        // 3. サウンドエンジンクラス
        // =========================================================================
        class SlotSound {
            constructor() { this.sounds = {}; }
            load(name, src) { this.sounds[name] = new Audio(src); }
            play(name) {
                if (this.sounds[name]) {
                    this.sounds[name].currentTime = 0;
                    this.sounds[name].play().catch(e => console.log("ユーザー操作待ち：", e));
                }
            }
        }
        const soundEngine = new SlotSound();
        soundEngine.load('leverOn', './sound/leveron.wav');
        soundEngine.load('stop', './sound/stop.wav');

        // =========================================================================
        // 4. リールテクスチャ生成エンジン
        // =========================================================================
        async function generateHorizontalReel(symbolMaster, reelLayout, frameSize = 256) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = frameSize * reelLayout.length;
            canvas.height = frameSize;
            
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const symbolScales = { '7': 0.95, 'BAR': 0.95, 'BEL': 0.75, 'BUDOU': 0.75, 'PIERO': 0.80, 'RIP': 0.70, 'CHE': 0.75 };

            for (let i = 0; i < reelLayout.length; i++) {
                const layoutIdx = reelLayout.length - 1 - i; 
                const symbolId = reelLayout[layoutIdx];
                const imageSrc = symbolMaster[symbolId];
                if (!imageSrc) continue;

                const img = new Image();
                img.src = imageSrc;
                await new Promise(resolve => img.onload = resolve);

                const scale = symbolScales[symbolId] || 1.0;
                const drawSize = frameSize * scale;
                const offset = -drawSize / 2;

                ctx.save();
                ctx.translate(i * frameSize + frameSize / 2, frameSize / 2);
                ctx.rotate(Math.PI / 2);
                ctx.drawImage(img, offset, offset, drawSize, drawSize);
                ctx.restore();
            }
            return canvas;
        }

        // =========================================================================
        // 4.5 制御テーブル自動生成（完全物理同期・引き込み＆蹴飛ばし対応版）
        // =========================================================================
        function generateControlTables() {
            const states = [STATE_NO_BONUS, STATE_IN_BIG, STATE_IN_REG, STATE_JAC_BIG, STATE_JAC_REG];
            const flags = [FLAG_HAZURE, FLAG_BUDOU, FLAG_REPLAY, FLAG_CHERRY, FLAG_PIERO, FLAG_BELL, FLAG_BIG, FLAG_REG];

            states.forEach(st => {
                reelControls[st] = {};
                
                flags.forEach(flg => {
                    reelControls[st][flg] = [];

                    for (let reelIdx = 0; reelIdx < 3; reelIdx++) {
                        const hairetsu = reelHairetsu[reelIdx];
                        const table = new Array(21).fill(0);

                        // 押された位置（0〜20番）ごとにスベリコマ数を計算
                        for (let pressedPos = 0; pressedPos < 21; pressedPos++) {
                            let bestSlip = 0;
                            let found = false;

                            // 画面表示と配列添字の反転を考慮した「押下時の中段インデックス」
                            const actualPressedIdx = positiveModulo(20 - pressedPos, 21);

                            // -------------------------------------------------------------
                            // A. 小役フラグ成立時：成立した小役を最大4コマで引き込む
                            // -------------------------------------------------------------
                            if (flg === FLAG_BUDOU || flg === FLAG_REPLAY || flg === FLAG_CHERRY || flg === FLAG_PIERO || flg === FLAG_BELL) {
                                const targetSymbol = FLAG_TO_SYMBOL[flg];

                                // スベリコマ数 0〜4 コマを順にチェック（上から降ってくる＝加算方向）
                                for (let s = 0; s <= 4; s++) {
                                    let checkIdx = positiveModulo(actualPressedIdx + s, 21);
                                    let currentSymbol = hairetsu[checkIdx];

                                    if (currentSymbol === targetSymbol) {
                                        // チェリー以外を狙っている時に、中段にチェリーが止まるのを避ける（チェリーの引き込み規制）
                                        if (flg !== FLAG_CHERRY && currentSymbol === 'CHE') continue;
                                        
                                        bestSlip = s;
                                        found = true;
                                        break; // 最もスベリが少ない位置で引き込み確定
                                    }
                                }

                                // 万が一、配列上に4コマ以内で見つからなかった場合のセーフティ（引き込めない位置）
                                if (!found) {
                                    for (let s = 0; s <= 4; s++) {
                                        let checkIdx = positiveModulo(actualPressedIdx + s, 21);
                                        // ボーナス図柄（7, BAR）を避けて停止させる
                                        if (hairetsu[checkIdx] !== '7' && hairetsu[checkIdx] !== 'BAR') {
                                            bestSlip = s;
                                            break;
                                        }
                                    }
                                }
                            }
                            // -------------------------------------------------------------
                            // B. ボーナス成立時（フラグ保持中含む）：対象のボーナス図柄を引き込む
                            // -------------------------------------------------------------
                            else if (flg === FLAG_BIG || flg === FLAG_REG || st === STATE_IN_BIG || st === STATE_IN_REG) {
                                // 内部状態または当月フラグに応じて狙う図柄を決定
                                const isBigTarget = (flg === FLAG_BIG || st === STATE_IN_BIG);
                                const targetSymbol = isBigTarget ? '7' : 'BAR';

                                for (let s = 0; s <= 4; s++) {
                                    let checkIdx = positiveModulo(actualPressedIdx + s, 21);
                                    let currentSymbol = hairetsu[checkIdx];

                                    // 対象のボーナス図柄、または代用となるボーナス図柄があるか
                                    if (currentSymbol === targetSymbol || (isBigTarget && currentSymbol === 'BAR')) {
                                        bestSlip = s;
                                        found = true;
                                        break;
                                    }
                                }
                                
                                // まだボーナスを揃えない（揃えられない）位置の場合は、ハズレ制御に逃がす
                                if (!found) {
                                    for (let s = 0; s <= 4; s++) {
                                        let checkIdx = positiveModulo(actualPressedIdx + s, 21);
                                        if (hairetsu[checkIdx] !== '7' && hairetsu[checkIdx] !== 'BAR') {
                                            bestSlip = s;
                                            break;
                                        }
                                    }
                                }
                            }
                            // -------------------------------------------------------------
                            // C. 通常時のハズレ時：ボーナス図柄（7やBAR）を完全に蹴飛ばす
                            // -------------------------------------------------------------
                            else if (st === STATE_NO_BONUS && flg === FLAG_HAZURE) {
                                for (let s = 0; s <= 4; s++) {
                                    let checkIdx = positiveModulo(actualPressedIdx + s, 21);
                                    let currentSymbol = hairetsu[checkIdx];

                                    // 中段に7やBARが止まらない最小のスベリ位置を選択（蹴飛ばし）
                                    if (currentSymbol !== '7' && currentSymbol !== 'BAR') {
                                        bestSlip = s;
                                        break;
                                    }
                                }
                            }

                            // 決定したスベリコマ数をテーブルに格納
                            table[pressedPos] = bestSlip;
                        }
                        reelControls[st][flg][reelIdx] = table;
                    }
                });
            });

            console.log("【メイン基板】方向修正版・2次元制御テーブルの自動生成が完了しました。");
        }

        // =========================================================================
        // 5. Three.js 3D空間構築セットアップ
        // =========================================================================
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('cube').appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 5);
        camera.position.set(0, 0, 0.7);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 0.3;
        controls.maxDistance = 1.5;

        const light = new THREE.DirectionalLight(0xffffff, 0.5);
        light.position.set(0, 1, 1); 
        scene.add(light);

        const textureLoader = new THREE.TextureLoader();

        const createButtonMaterial = () => new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0 });
        const leverMaterial = createButtonMaterial();
        const ButLMaterial = createButtonMaterial();
        const ButCMaterial = createButtonMaterial();
        const ButRMaterial = createButtonMaterial();

        const texL = new THREE.CanvasTexture(await generateHorizontalReel(mySymbols, layoutLeft));
        const texC = new THREE.CanvasTexture(await generateHorizontalReel(mySymbols, layoutCenter));
        const texR = new THREE.CanvasTexture(await generateHorizontalReel(mySymbols, layoutRight));

        const matReelL = new THREE.MeshPhongMaterial({ map: texL });
        const matReelC = new THREE.MeshPhongMaterial({ map: texC });
        const matReelR = new THREE.MeshPhongMaterial({ map: texR });

        const geoReel = new THREE.CylinderGeometry(reelheight, reelheight, reelWidth, 21, 1, true);
        const meshReelL = new THREE.Mesh(geoReel, matReelL);
        const meshReelC = new THREE.Mesh(geoReel, matReelC);
        const meshReelR = new THREE.Mesh(geoReel, matReelR);

        const meshReels = [meshReelL, meshReelC, meshReelR];

        meshReelL.position.set(-1 * (reelWidth * 1.5 + 0.01), 0, 0);
        meshReelC.position.set(0, 0, 0);
        meshReelR.position.set(reelWidth * 1.5 + 0.01, 0, 0);

        meshReels.forEach(mesh => {
            mesh.rotation.set(0, 0, Math.PI / 2);
            // ★修正ポイント：図柄の隙間が正面を向かないよう、+0.5コマ分のオフセット（rad1koma * 0.5）を追加してセンタリング
            mesh.rotation.x = (rad1koma * reelPos[0]) + (rad1koma * 0.5);
            scene.add(mesh);
        });

        const leverBall = new THREE.Mesh(new THREE.SphereGeometry(0.02, 32, 32), leverMaterial);
        leverBall.position.set(-0.18, -0.14, reelheight + 0.0001);
        scene.add(leverBall);

        const geoButton = new THREE.CylinderGeometry(0.02, 0.02, 0.003, 32, 1, false);
        const ButL = new THREE.Mesh(geoButton, ButLMaterial);
        const ButC = new THREE.Mesh(geoButton, ButCMaterial);
        const ButR = new THREE.Mesh(geoButton, ButRMaterial);

        ButL.position.set(-1 * (reelWidth * 1.5 + 0.01), -0.14, reelheight + 0.0001);
        ButC.position.set(0, -0.14, reelheight + 0.0001);
        ButR.position.set(reelWidth * 1.5 + 0.01, -0.14, reelheight + 0.0001);

        [ButL, ButC, ButR].forEach(btn => {
            btn.rotation.set(Math.PI / 2, 0, 0);
            scene.add(btn);
        });

        const meshMask = new THREE.Mesh(
            new THREE.PlaneGeometry(0.42, 0.42 / 1262 * 646),
            new THREE.MeshPhongMaterial({ map: textureLoader.load("./img/banmen.png"), transparent: true, side: THREE.DoubleSide })
        );
        meshMask.position.set(0.007, -0.005, reelheight); 
        scene.add(meshMask);

        const createLampMaterial = (path) => new THREE.MeshPhongMaterial({
            map: textureLoader.load(path), transparent: true, side: THREE.DoubleSide,
            emissive: new THREE.Color(0xffffff), emissiveIntensity: -0.15, alphaTest: 0.1, depthWrite: true, depthTest: true
        });

        const meshHanaL = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.03), createLampMaterial("./img/shine.png"));
        meshHanaL.position.set(-(reelWidth * 1.5 + 0.01 + 0.07), -0.09, reelheight + 0.0001);
        meshHanaL.renderOrder = 999;
        scene.add(meshHanaL);

        const mesh32chan = new THREE.Mesh(new THREE.PlaneGeometry(0.0275 * 1.3, 0.0738 * 1.3), createLampMaterial("./img/32chan.png"));
        mesh32chan.position.set((reelWidth * 1.5 + 0.01 + 0.07), 0.0, reelheight + 0.0001);
        mesh32chan.renderOrder = 999;
        scene.add(mesh32chan);

        // =========================================================================
        // 6. メイン基板ロジック
        // =========================================================================
        function leverOn65536() {
            const array = new Uint16Array(1);
            window.crypto.getRandomValues(array);
            const rand = array[0]; 

            const REPLAY_RANGE   = Math.round(65536 / 7.30);   
            const BUDO_RANGE     = Math.round(65536 / 5.78);   
            const PIERO_RANGE    = Math.round(65536 / 1024.0); 
            const BELL_RANGE     = Math.round(65536 / 1024.0); 
            const ST_BIG_RANGE   = Math.round(65536 / 364.1);  
            const ST_REG_RANGE   = Math.round(65536 / 364.1);  
            const CH_BIG_RANGE   = Math.round(65536 / 993.0);  
            const CH_REG_RANGE   = Math.round(65536 / 655.4);  
            const CH_ONLY_RANGE  = Math.round(65536 / 39.8);   

            let currentScope = 0;

            currentScope += REPLAY_RANGE;  if (rand < currentScope) return "REPLAY";
            currentScope += BUDO_RANGE;    if (rand < currentScope) return "BUDO";
            currentScope += PIERO_RANGE;   if (rand < currentScope) return "PIERO";
            currentScope += BELL_RANGE;    if (rand < currentScope) return "BELL";
            currentScope += ST_BIG_RANGE;  if (rand < currentScope) return "STANDALONE_BIG";
            currentScope += ST_REG_RANGE;  if (rand < currentScope) return "STANDALONE_REG";
            currentScope += CH_BIG_RANGE;  if (rand < currentScope) return "CHERRY_BIG";
            currentScope += CH_REG_RANGE;  if (rand < currentScope) return "CHERRY_REG";
            currentScope += CH_ONLY_RANGE; if (rand < currentScope) return "CHERRY";

            return "HAZURE";
        }

        function onLeverOn() {
            if (reelTotalMsec.some(msec => msec !== -1)) return;

            if (main_state === STATE_JAC_BIG || main_state === STATE_JAC_REG) {
                console.log("ボーナス消化終了。通常時に戻ります。");
                main_state = STATE_NO_BONUS;
                main_flgKoyaku = FLAG_HAZURE;
            }

            console.log("レバーオン！");
            soundEngine.play('leverOn');
            
            leverMaterial.emissiveIntensity = 2.0; 
            startReel();
            
            const hitResult = leverOn65536();
            console.log(`【乱数判定結果】=> ${hitResult}`);

            if (main_state === STATE_NO_BONUS) {
                if (hitResult === "BUDO") main_flgKoyaku = FLAG_BUDOU;
                else if (hitResult === "REPLAY") main_flgKoyaku = FLAG_REPLAY;
                else if (hitResult === "CHERRY") main_flgKoyaku = FLAG_CHERRY;
                else if (hitResult === "PIERO") main_flgKoyaku = FLAG_PIERO;
                else if (hitResult === "BELL") main_flgKoyaku = FLAG_BELL;
                else if (hitResult === "STANDALONE_BIG" || hitResult === "CHERRY_BIG") { 
                    main_flgKoyaku = FLAG_BIG; 
                    main_state = STATE_IN_BIG; 
                } 
                else if (hitResult === "STANDALONE_REG" || hitResult === "CHERRY_REG") { 
                    main_flgKoyaku = FLAG_REG; 
                    main_state = STATE_IN_REG; 
                } 
                else main_flgKoyaku = FLAG_HAZURE;
            } 
            else if (main_state === STATE_IN_BIG || main_state === STATE_IN_REG) {
                main_flgKoyaku = FLAG_HAZURE; 
            }

            if (main_state === STATE_IN_BIG || main_state === STATE_IN_REG) {
                meshHanaL.material.emissiveIntensity = 3.0;
                mesh32chan.material.emissiveIntensity = 3.0;
            } else {
                meshHanaL.material.emissiveIntensity = -0.15;
                mesh32chan.material.emissiveIntensity = -0.15;
            }

            ButLMaterial.emissiveIntensity = 1;
            ButCMaterial.emissiveIntensity = 1;
            ButRMaterial.emissiveIntensity = 1;
        }

        // =========================================================================
        // 7. リール制御・駆動ロジック
        // =========================================================================
        function startReel() {
            reelTotalMsec = [ msec1koma * reelPos[enmLeft], msec1koma * reelPos[enmCenter], msec1koma * reelPos[enmRight] ];
            reelPosWillStop = [-1, -1, -1];
        }

        function stopReel(pos) {
            if (reelPosWillStop[pos] !== -1) return;
            if (reelTotalMsec[pos] === -1) return; 
            
            soundEngine.play('stop');

            const pressedPos = reelPos[pos]; 
            const slippage = reelControls[main_state][main_flgKoyaku][pos][pressedPos];
            
            // ★修正ポイント：滑る方向を「足し算」から「引き算（逆転考慮）」に変更
            // 3Dモデルの回転方向（インデックスが増える側）に対して、絵柄番号を進める＝インデックスを戻す
            const targetPos = positiveModulo(pressedPos - slippage, 21);

            console.log(`リール[${pos}] 押下:${pressedPos+1}番目 => 【${slippage}コマ滑り】 => 停止:${targetPos+1}番目`);

            reelPosWillStop[pos] = targetPos;
        }

        function getReelPos(totalMsec) { return Math.floor(totalMsec / msec1koma) % 21; }
        function positiveModulo(dividend, divisor) { let remainder = dividend % divisor; return remainder < 0 ? remainder + Math.abs(divisor) : remainder; }
        
        function checkLinePayout() {
            // 停止した際のインデックス（0〜20）
            const stopL = reelPos[enmLeft];
            const stopC = reelPos[enmCenter];
            const stopR = reelPos[enmRight];

            // ★修正ポイント：絵柄番号と配列添字の反転を完全に考慮
            // インデックス0のときに配列の21番目（インデックス20）、インデックス19のときに配列の2番目（インデックス1）を参照する
            const idxL = positiveModulo(20 - stopL, 21);
            const idxC = positiveModulo(20 - stopC, 21);
            const idxR = positiveModulo(20 - stopR, 21);

            const symL = layoutLeft[idxL];
            const symC = layoutCenter[idxC];
            const symR = layoutRight[idxR];

            // ログ上の「番数」の表示も、1番〜21番の正しい絵柄番号に一致させる
            console.log(`【有効ライン（中段）停止番数】 左: ${idxL + 1}番 / 中: ${idxC + 1}番 / 右: ${idxR + 1}番`);
            console.log(`【出目（画面と一致）】 左: ${symL} / 中: ${symC} / 右: ${symR}`);

            if (main_state === STATE_IN_BIG) {
                if (symL === '7' && symC === '7' && symR === '7') {
                    console.log("🔥 BIG BONUS 揃い！！");
                    main_state = STATE_JAC_BIG;
                    meshHanaL.material.emissiveIntensity = -0.15;
                    mesh32chan.material.emissiveIntensity = -0.15;
                    return;
                }
            }
            if (main_state === STATE_IN_REG) {
                if ((symL === '7' && symC === '7' && symR === 'BAR') || (symL === 'BAR' && symC === 'BAR' && symR === 'BAR')) {
                    console.log("✨ REG BONUS 揃い！！");
                    main_state = STATE_JAC_REG;
                    meshHanaL.material.emissiveIntensity = -0.15;
                    mesh32chan.material.emissiveIntensity = -0.15;
                    return;
                }
            }

            if (symL === 'BUDOU' && symC === 'BUDOU' && symR === 'BUDOU') console.log("◆ ぶどう揃い");
            else if (symL === 'RIP' && symC === 'RIP' && symR === 'RIP') console.log("◆ リプレイ揃い");
            else if (symL === 'CHE') console.log("◆ チェリー");
            else if (symL === 'PIERO' && symC === 'PIERO' && symR === 'PIERO') console.log("◆ ピエロ揃い");
            else if (symL === 'BEL' && symC === 'BEL' && symR === 'BEL') console.log("◆ ベル揃い");
        }

        function paintReel(msec, pos) {
            if (isNaN(msec)) msec = 0;
            if (0 <= reelTotalMsec[pos]) { 
                reelTotalMsec[pos] += msec;

                if (reelPos[pos] != reelPosWillStop[pos]) { 
                    meshReels[pos].rotation.x += 2 * Math.PI * (msec / (msec1koma * 21));
                    reelPos[pos] = getReelPos(reelTotalMsec[pos]);
                } else {
                    // ★修正ポイント：ピタ止まり位置にも、初期配置と同様に+0.5コマ分のオフセットを加算してセンターを出す
                    meshReels[pos].rotation.x = (rad1koma * reelPos[pos]) + (rad1koma * 0.5); 
                    reelTotalMsec[pos] = -1;

                    if (pos === enmLeft) ButLMaterial.emissiveIntensity = 0;
                    if (pos === enmCenter) ButCMaterial.emissiveIntensity = 0;
                    if (pos === enmRight) ButRMaterial.emissiveIntensity = 0;

                    if (reelTotalMsec.every(msecVal => msecVal === -1)) {
                        checkLinePayout();
                    }
                }
                leverMaterial.emissiveIntensity = 0;
            }
            if (reelPos[pos] != reelPosPrev[pos]) { reelPosPrev[pos] = reelPos[pos]; }
        }

        function updateLeverBlink(time) {
            if (leverMaterial && main_state === STATE_NO_BONUS) {
                leverMaterial.emissiveIntensity = (Math.sin(time * 0.02) + 1) / 2;
            }
        }

        // =========================================================================
        // 8. ループ処理 ＆ イベントハンドリング
        // =========================================================================
        function animate() {
            controls.update();
        }

        function frm(timeStamp) {
            if (timeStart === undefined) timeStart = timeStamp;
            timeElapsed = timeStamp - timeStart;
            timeStart = timeStamp;

            paintReel(timeElapsed, enmLeft);
            paintReel(timeElapsed, msec1koma * 0, enmLeft); 
            paintReel(timeElapsed, enmCenter);
            paintReel(timeElapsed, enmRight);
            
            if (reelTotalMsec.every(msec => msec === -1)) {
                updateLeverBlink(new Date());
            }

            animate();
            renderer.render(scene, camera);
            requestAnimationFrame(frm);
        }

        generateControlTables();
        requestAnimationFrame(frm);

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (raycaster.intersectObject(leverBall).length > 0) { onLeverOn(); }
            if (raycaster.intersectObject(ButL).length > 0) { stopReel(enmLeft); }
            if (raycaster.intersectObject(ButC).length > 0) { stopReel(enmCenter); }
            if (raycaster.intersectObject(ButR).length > 0) { stopReel(enmRight); }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); onLeverOn(); }
            if (e.code === 'KeyF' || e.code === 'KeyJ') { stopReel(enmLeft); }
            if (e.code === 'KeyG' || e.code === 'KeyK') { stopReel(enmCenter); }
            if (e.code === 'KeyH' || e.code === 'KeyL') { stopReel(enmRight); }
        });
    </script>
</body>
